name = "gaia-chat-memory"
main = "src/index.ts"
compatibility_date = "2025-05-15"
# account_id set via CLOUDFLARE_ACCOUNT_ID env var

[[d1_databases]]
binding = "DB"
database_name = "gaia-db"
database_id = "fc21c7ca-0233-4bf6-8372-2352d0faaf8e"

[[vectorize]]
binding = "VECTORIZE"
index_name = "gaia-chat-summaries-bge-m3"

[ai]
binding = "AI"

[observability]
enabled = true

[vars]
LLM_BASE_URL = ""
LLM_PROVIDER = "custom-minimax"
LLM_MODEL = "MiniMax-M2.7"
LLM_API_MODE = "openai"
