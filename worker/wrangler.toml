name = "gaia"
main = "src/index.ts"
compatibility_date = "2025-05-15"
# account_id set via CLOUDFLARE_ACCOUNT_ID env var

[[d1_databases]]
binding = "DB"
database_name = "gaia-db"
database_id = "fc21c7ca-0233-4bf6-8372-2352d0faaf8e"

[[services]]
binding = "DATA_SERVICE"
service = "gaia-data"

[observability]
enabled = true

[vars]
# LLM vars come from .env or wrangler secret
# LLM_BASE_URL, LLM_PROVIDER, LLM_MODEL, LLM_API_MODE, LLM_MAX_TOKENS
