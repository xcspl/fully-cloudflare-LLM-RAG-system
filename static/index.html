<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gAIa Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.5 system-ui,sans-serif;background:#0f0f0f;color:#e0e0e0;height:100dvh;display:flex;flex-direction:column}
#log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.75rem}
.msg{max-width:80%;padding:.6rem 1rem;border-radius:1rem;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:.25rem}
.msg.assistant{align-self:flex-start;background:#1e1e1e;border:1px solid #333;border-bottom-left-radius:.25rem}
.msg.assistant strong{color:#fbbf24}.msg.assistant em{color:#93c5fd}.msg.assistant code{background:#333;padding:.1em .3em;border-radius:3px;font-size:13px}
.think{display:block;font-size:12px;color:#666;cursor:pointer;margin:.3em 0;padding:.3em .5em;border-left:2px solid #444;background:#111;border-radius:0 4px 4px 0;user-select:none}
.think:hover{color:#999}.think.open{color:#aaa}.think .body{display:none;margin-top:.3em;color:#999;white-space:pre-wrap}.think.open .body{display:block}
.spin{display:inline-block;width:8px;height:8px;border-radius:50%;background:#888;animation:d .6s infinite alternate}
.spin:nth-child(2){animation-delay:.2s}.spin:nth-child(3){animation-delay:.4s}
@keyframes d{to{background:#fff;transform:translateY(-6px)}}
#form{display:flex;padding:.75rem;gap:.5rem;border-top:1px solid #222;background:#0a0a0a}
#form input{flex:1;padding:.6rem 1rem;border:1px solid #333;border-radius:1.5rem;background:#1a1a1a;color:#e0e0e0;font-size:14px;outline:none}
#form input:focus{border-color:#3b82f6}
#form button{padding:.6rem 1.25rem;border:none;border-radius:1.5rem;background:#2563eb;color:#fff;font-size:14px;cursor:pointer}
#form button:hover{background:#1d4ed8}
</style>
</head>
<body>
<div id="log"></div>
<form id="form"><input id="input" placeholder="Ask gAIa..." autofocus><button>Send</button></form>
<script>
const API = "https://gaia-api.earth-team.org";
const log = document.getElementById("log");
const inp = document.getElementById("input");
let sid = "";
let uid = "web-" + Math.random().toString(36).slice(2, 8);

document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const m = inp.value.trim();
  if (!m) return;
  inp.value = "";
  add("user", m);
  const div = add("assistant", "");

  try {
    const r = await fetch(API + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: m, user_id: uid, session_id: sid || void 0 }),
    });
    sid = r.headers.get("X-Session-Id") || sid;

    const isStream = r.headers.get("Content-Type")?.includes("text/event-stream");

    if (isStream) {
      div.innerHTML = "";
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "", raw = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop() || "";
        for (const l of lines) {
          if (!l.startsWith("data: ")) continue;
          try {
            const j = JSON.parse(l.slice(6));
            const c = j.choices?.[0]?.delta?.content;
            if (c) raw += c;
          } catch {}
        }
        // Strip think blocks in-flight: only show content outside <think>
        div.innerHTML = raw
          .replace(/<think>[\s\S]*?<\/think>/g, "")
          .replace(/<think>[\s\S]*$/, "") // unclosed think block
          .replace(/</g, "&lt;")
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.+?)\*/g, "<em>$1</em>")
          .replace(/\n/g, "<br>");
      }
      if (!div.innerHTML.trim()) div.innerHTML = "<em>(empty)</em>";
    } else {
      const d = await r.json();
      div.innerHTML = d.reply
        ? d.reply
            .replace(/<think>[\s\S]*?<\/think>/g, "")
            .replace(/</g, "&lt;")
            .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/\*(.+?)\*/g, "<em>$1</em>")
            .replace(/\n/g, "<br>")
        : "<em>(no response)</em>";
    }

  } catch (x) {
    div.innerHTML = "<em>Error: " + x.message + "</em>";
  }
  log.scrollTop = log.scrollHeight;
};

function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = role === "assistant"
    ? "<span class=spin></span><span class=spin></span><span class=spin></span>"
    : text.replace(/</g, "&lt;");
  log.appendChild(d);
  return d;
}
</script>
</body>
</html>
