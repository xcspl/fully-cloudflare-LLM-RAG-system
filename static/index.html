<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gAIa — EarthTeam AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.5 system-ui,sans-serif;background:#0f0f0f;color:#e0e0e0;height:100dvh;display:flex;flex-direction:column}
#log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.75rem}
.welcome{text-align:center;color:#666;margin-top:3rem;line-height:1.8}
.welcome h1{color:#e0e0e0;font-size:1.3rem;margin-bottom:.5rem}
.msg{max-width:80%;padding:.6rem 1rem;border-radius:1rem;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:.25rem}
.msg.assistant{align-self:flex-start;background:#1e1e1e;border:1px solid #333;border-bottom-left-radius:.25rem}
.msg.assistant .status{color:#888;font-style:italic;animation:pulse 2s ease-in-out infinite}.msg.assistant .status::after{content:'';animation:dots 1.5s steps(4,infinite);display:inline-block;width:1em;text-align:left}@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:'...'}}@keyframes pulse{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
.msg.assistant strong{color:#fbbf24}.msg.assistant em{color:#93c5fd}
.msg.assistant code{background:#333;padding:.1em .3em;border-radius:3px;font-size:13px}
.msg.assistant pre{background:#0a0a0a;border:1px solid #333;border-radius:6px;padding:.75rem;margin:.5em 0;overflow-x:auto;font-size:13px;line-height:1.4}
.msg.assistant pre code{background:none;padding:0}
.think{display:block;font-size:12px;color:#666;cursor:pointer;margin:.3em 0;padding:.3em .5em;border-left:2px solid #444;background:#111;border-radius:0 4px 4px 0;user-select:none}
.think:hover{color:#999}.think.open{color:#aaa}.think .body{display:none;margin-top:.3em;color:#999;white-space:pre-wrap}.think.open .body{display:block}}
#footer{display:flex;flex-direction:column}
#toolbar{display:flex;justify-content:space-between;align-items:center;padding:.3rem 1rem;background:#0a0a0a}
#toolbar span{font-size:11px;color:#555;cursor:pointer}
#toolbar span:hover{color:#999}
#form{display:flex;padding:.75rem;gap:.5rem;border-top:1px solid #222;background:#0a0a0a}
#form input{flex:1;padding:.6rem 1rem;border:1px solid #333;border-radius:1.5rem;background:#1a1a1a;color:#e0e0e0;font-size:14px;outline:none}
#form input:focus{border-color:#3b82f6}
#form button{padding:.6rem 1.25rem;border:none;border-radius:1.5rem;background:#2563eb;color:#fff;font-size:14px;cursor:pointer}
#form button:hover{background:#1d4ed8}
#form button.stop{background:#dc2626;display:none}
#form button.stop:hover{background:#b91c1c}
.fade{color:#555;font-size:11px;text-align:center;padding:.3rem 0}
</style>
</head>
<body>
<div id="log"><div class="welcome"><h1>gAIa</h1><p>EarthTeam's AI assistant</p><p>Ask me about conservation, EarthTeam, Freeland,<br>Earth Credits (EarthTeam Stars), or protecting the planet.</p></div></div>
<div id="footer">
<div id="toolbar"><span onclick="newChat()">+ New chat</span><span class="fade">gAIa may make mistakes. Verify important info.</span></div>
<form id="form"><input id="input" placeholder="Ask gAIa..." autofocus><button id="sendBtn">Send</button><button class="stop" id="stopBtn" type="button">Stop</button></form>
</div>
<script>
const API = "https://gaia-api.earth-team.org";
const log = document.getElementById("log");
const inp = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const stopBtn = document.getElementById("stopBtn");
// UUIDv7 — RFC 9562, from uuidjs/uuid (MIT), monotonic, time-sortable
function uuidv7(e={}){let t=e.random||crypto.getRandomValues(new Uint8Array(16)),n=e.msecs??Date.now(),r=e.seq,a=new Uint8Array(16);if(void 0===uuidv7._c){uuidv7._c=0,uuidv7._h=null,uuidv7._l=null}n>uuidv7._c&&void 0===e.msecs&&(uuidv7._c=n,void 0!==r&&(uuidv7._h=uuidv7._l=null));let s=uuidv7._h,f=uuidv7._l;if(void 0!==r&&(r=Math.min(r,2147483647),s=r>>>19&4095,f=1048575&r),null===s||null===f){s=((3&t[6])<<8)|t[7];f=((63&t[8])<<13)|(t[9]<<5)|(t[10]>>>3)}if(n+1e4>uuidv7._c&&void 0===r){if(++f>524287&&(f=0,++s>4095)){s=0,uuidv7._c++}}else uuidv7._c=n;uuidv7._h=s,uuidv7._l=f;let o=uuidv7._c;a[0]=(o/1099511627776)&255,a[1]=(o/4294967296)&255,a[2]=(o/16777216)&255,a[3]=(o/65536)&255,a[4]=(o/256)&255,a[5]=255&o,a[6]=((s>>>4)&15)|112,a[7]=255&s,a[8]=((f>>>13)&63)|128,a[9]=(f>>>5)&255,a[10]=((f<<3)&255)|(7&t[10]),a[11]=t[11],a[12]=t[12],a[13]=t[13],a[14]=t[14],a[15]=t[15];return[...a].map((b,i)=>b.toString(16).padStart(2,"0")+([4,6,8,10].includes(i)?"-":"")).join("")}
const THINK_WORDS = ["Thinking…","Analyzing…","Processing…","Reasoning…","Contemplating…"];
const TOOL_WORDS = ["Searching knowledge base…","Looking that up…","Finding information…","Consulting sources…","Fetching data…"];
const WAIT_WORDS = ["Working on it…","Almost there…","Getting ready…","Hang tight…"];
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
let sid = uuidv7(), uid = "web-" + Math.random().toString(36).slice(2, 8), abort, statusTimer;

function newChat(){sid=uuidv7();log.innerHTML='<div class="welcome"><h1>gAIa</h1><p>EarthTeam\'s AI assistant</p><p>Ask me about conservation, EarthTeam, Freeland,<br>Earth Credits (EarthTeam Stars), or protecting the planet.</p></div>'}

document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const m = inp.value.trim();
  if (!m) return;
  inp.value = ""; inp.focus();
  clearWelcome();
  add("user", m);
  const div = add("assistant", "");
  let currentWord = pick(THINK_WORDS);
  showStatus(currentWord);
  // Cycle status words while waiting
  statusTimer = setInterval(() => {
    const s = document.querySelectorAll(".msg.assistant .status");
    const last = s[s.length-1];
    if (last) { currentWord = pick(last.textContent?.startsWith("Search") ? TOOL_WORDS : THINK_WORDS); last.textContent = currentWord; }
  }, 2000);

  abort = new AbortController();
  sendBtn.style.display = "none";
  stopBtn.style.display = "inline-block";
  let think = "", visible = "";

  try {
    const r = await fetch(API + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: m, user_id: uid, session_id: sid }),
      signal: abort.signal,
    });
    sid = r.headers.get("X-Session-Id") || sid;

    if (r.headers.get("Content-Type")?.includes("text/event-stream")) {
      clearInterval(statusTimer);
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "", raw = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop() || "";
        for (const l of lines) {
          if (!l.startsWith("data: ")) continue;
          try {
            const j = JSON.parse(l.slice(6));
            const c = j.choices?.[0]?.delta?.content;
            if (c) raw += c;
          } catch {}
        }
        // Show word-by-word: only render what's outside <think>
        const parts = splitThink(raw);
        think = parts.think; visible = parts.visible;
        if (visible.trim()) {
          div.innerHTML = render(visible);
        } else if (think.trim()) {
          showStatus(pick(THINK_WORDS));
        }
      }
    } else {
      const d = await r.json();
      if (d.reply) {
        const parts = splitThink(d.reply);
        think = parts.think; visible = parts.visible;
      }
      div.innerHTML = render(visible) || "<em>(no response)</em>";
    }

    if (think.trim()) {
      div.innerHTML = `<div class="think" onclick="this.classList.toggle('open')">\u{1F4AD} Show reasoning<span class="body">${think.replace(/</g,"&lt;").replace(/\n/g,"<br>")}</span></div>` + div.innerHTML;
    }
    if (!div.innerHTML.trim()) div.innerHTML = "<em>(empty)</em>";

  } catch (x) {
    clearInterval(statusTimer);
    if (x.name === "AbortError") {
      div.innerHTML = render(visible) || "<em>(stopped)</em>";
      if (think.trim()) div.innerHTML = `<div class="think" onclick="this.classList.toggle('open')">\u{1F4AD} Show reasoning<span class="body">${think.replace(/</g,"&lt;").replace(/\n/g,"<br>")}</span></div>` + div.innerHTML;
    } else {
      div.innerHTML = "<em>Error: " + x.message + "</em>";
    }
  }
  clearInterval(statusTimer);
  sendBtn.style.display = "";
  stopBtn.style.display = "none";
  abort = null;
  log.scrollTop = log.scrollHeight;
};

stopBtn.onclick = () => { if (abort) abort.abort(); };

function clearWelcome() {
  const w = log.querySelector(".welcome");
  if (w) w.remove();
}

function splitThink(raw) {
  const think = [], visible = [];
  let remaining = raw;
  while (remaining.length) {
    const start = remaining.indexOf("<think>");
    if (start === -1) { visible.push(remaining); break; }
    visible.push(remaining.slice(0, start));
    const end = remaining.indexOf("</think>", start + 7);
    if (end === -1) { think.push(remaining.slice(start + 7)); break; }
    think.push(remaining.slice(start + 7, end));
    remaining = remaining.slice(end + 8);
  }
  return { think: think.join(""), visible: visible.join("") };
}

function render(text) {
  let html = text
    .replace(/</g, "&lt;")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>");
  // Code blocks: ```code``` → <pre><code>code</code></pre>
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${code.replace(/&lt;/g,"<").replace(/&gt;/g,">")}</code></pre>`);
  html = html.replace(/\n/g, "<br>");
  return html;
}

function showStatus(text) {
  const els = document.querySelectorAll(".msg.assistant .status");
  const last = els[els.length - 1];
  if (last) last.textContent = text;
}

function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = role === "assistant"
    ? "<span class=status>" + pick(THINK_WORDS) + "</span>"
    : text.replace(/</g, "&lt;");
  log.appendChild(d);
  return d;
}
</script>
</body>
</html>
