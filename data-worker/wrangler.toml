name = "gaia-data"
main = "src/index.ts"
compatibility_date = "2025-05-15"
account_id = "{ACCOUNT_ID}"

[[d1_databases]]
binding = "DB"
database_name = "gaia-db"
database_id = "fc21c7ca-0233-4bf6-8372-2352d0faaf8e"

[[vectorize]]
binding = "VECTORIZE"
index_name = "gaia-docs-bge-m3"

[ai]
binding = "AI"

[observability]
enabled = true

[vars]
LLM_BASE_URL = ""
CANON_PROVIDER = "custom-deep2"
CANON_MODEL = "deepseek-v4-flash"

# account_id set via CLOUDFLARE_ACCOUNT_ID env var
